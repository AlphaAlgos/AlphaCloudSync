ShortDescription: Lightweight Windows cloud backup, safe restore, and persistent Explorer virtual drive for Google Drive.
Description: >-
  AlphaCloudSync is an open-source modular Windows desktop studio powered by Rclone and WinFsp.
  Built as a fast, zero-bloat cloud storage control core starting with Google Drive — featuring
  per-account JSON skip rules, zero My Computer (1) duplication, Hybrid Unified (AlphaCloudSync) +
  Standalone persistent Explorer drives, zero-RAM folder badges & Explorer right-click menu,
  fast Real-Time Auto-Sync, 1-click Tray Global Pause, overwrite-protected Safe Restore,
  Drive Trash management, Dynamic Cloud Island, and 7 UI languages (345 keys + Arabic RTL).
