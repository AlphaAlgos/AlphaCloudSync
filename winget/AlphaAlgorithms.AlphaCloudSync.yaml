ShortDescription: Lightweight Windows cloud backup, safe restore, and persistent Explorer virtual drive for Google Drive.
Description: >-
  AlphaCloudSync is an open-source Windows desktop application powered by Rclone and WinFsp.
  Built as a fast, zero-bloat replacement for Google Drive for Desktop with JSON exclusion rules,
  zero My Computer (1) duplication, multi-account isolation, Stream/Mirror persistent virtual drives,
  safe overwrite-protected restore, Drive Trash management, and 7 UI languages.
